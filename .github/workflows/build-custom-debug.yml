name: Build v2rayNG Auto V1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/build-custom-debug.yml"
      - "V2rayNG/**"
      - "AndroidLibXrayLite"
      - "hev-socks5-tunnel"
      - "compile-hevtun.sh"

permissions:
  contents: read

concurrency:
  group: custom-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed V1.0 universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            V2rayNG/*.gradle.kts
            V2rayNG/gradle/libs.versions.toml
            V2rayNG/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865"

      - name: Prepare stable APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.V2RAYNG_AUTO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/v2rayng-auto.p12"
          chmod 600 "$RUNNER_TEMP/v2rayng-auto.p12"

      - name: Build native tunnel libraries
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh

      - name: Add native libraries to the Android app
        run: cp -R libs V2rayNG/app/

      - name: Download the V2Ray core library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core_tag="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          mkdir -p V2rayNG/app/libs
          gh release download "$core_tag" \
            --repo 2dust/AndroidLibXrayLite \
            --pattern libv2ray.aar \
            --dir V2rayNG/app/libs

      - name: Build signed F-Droid release APK
        working-directory: V2rayNG
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/v2rayng-auto.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V2RAYNG_AUTO_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: v2rayng-auto
          ANDROID_KEY_PASSWORD: ${{ secrets.V2RAYNG_AUTO_KEYSTORE_PASSWORD }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testFdroidReleaseUnitTest --tests 'com.v2ray.ang.handler.AccountConfigTest' --tests 'com.v2ray.ang.handler.ManualConfigModesTest' --tests 'com.v2ray.ang.handler.ServerHealthMemoryTest' --tests 'com.v2ray.ang.handler.StructuredSubscriptionParserTest' --tests 'com.v2ray.ang.handler.SubscriptionMetadataManagerTest' --tests 'com.v2ray.ang.util.AccountDataFormatterTest' assembleFdroidRelease --no-daemon --stacktrace

      - name: Verify universal APK
        run: |
          apk_path="$(find V2rayNG/app/build/outputs/apk/fdroid/release -name '*_universal.apk' -print -quit)"
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          badging="$($ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging "$apk_path")"
          printf '%s\n' "$badging" | grep -F "package: name='com.girikhi.v2rayng.auto'"
          printf '%s\n' "$badging" | grep -F "versionName='1.0'"
          printf '%s\n' "$badging" | grep -F "application-label:'v2rayNG Auto'"
          if printf '%s\n' "$badging" | grep -q "application-debuggable"; then
            echo "APK must not be debuggable" >&2
            exit 1
          fi

      - name: Upload universal APK only
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-Auto-V1.0-universal
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*_universal.apk
          if-no-files-found: error
          retention-days: 14
